detector: "yolov8n"
detector_frozen_day: 6

split_manifest: data/ua_detrac/split_manifest.json
split: test
detections_source: "detections_cache/"

conf_thresh: 0.25
nms_thresh: 0.45

cache_frame_index_base: 0   # provisional until Check 4 confirms

reid_model: osnet_x1_0_veri_776

trackers:
  - sort
  - deepsort
  - bytetrack

min_track_length: 15
max_interp_gap: 3

bytetrack:
  track_high_thresh: 0.50
  track_low_thresh: 0.10
  match_thresh: 0.80
  max_time_lost: 30

seed: 42