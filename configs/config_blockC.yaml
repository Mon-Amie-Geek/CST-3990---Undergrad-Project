# config_blockC.yaml — Block C Feature Extraction Configuration
# Populated: Day 10 (F1 + F2). F3 added Day 11. Scaler added Day 11.

#  Upstream frozen selections
detector: yolov8n                          # frozen from Block A (block_a_results.csv)
tracker: sort                              # frozen from Block B (block_b_results.json)

# Trajectory source (layout-aware — detect variant at runtime)
trajectory_base: logs/block_b/
trajectory_suffix: _final.json
trajectory_stage: final

# Warm-up stripping 
warmup_frames_formula: "max(10, int(0.4 * fps))"
metadata_source: logs/metadata.json

# ROI Policy 
roi_policy: full_frame
# Limitation: full-frame ROI includes roadside stationary vehicles.
# Pixel-based ROI requires camera calibration outside this project's scope.

# F1: Density/Flow Features
f1:
  vehicle_count: true
  roi_occupancy: true
  roi_occupancy_method: relative

# F2: Speed/Velocity Features
f2:
  vel_px_sec: true
  speed_window_sec: 0.2
  smoothed_column: vel_px_sec_smooth
  keep_raw: true

# ── F3: Interaction Features (Fix F07, F28) — Day 11 ─────────────────────────
# prox_window_sec: TEMPORAL rolling window in seconds (Fix F07).
#   Converted to frames at runtime: prox_window = int(2.0 * fps).
#   At 25 FPS = 50 frames (~2.0 s). NOT a spatial threshold.
# proximity_threshold_dist: SPATIAL normalised-distance threshold.
#   Distinct from prox_window_sec — this controls proximity_flag, not window size.
#   0.15 = 15% of frame diagonal (image-space proxy, not calibrated metres).
f3:
  inter_vehicle_dist_norm: true
  prox_window_sec: 2.0                  # temporal rolling window in seconds (Fix F07)
  proximity_threshold_dist: 0.15        # spatial normalised distance threshold for proximity_flag
  dwell_time_sec: true
  proximity_flag: true
  proximity_count_rolling: true         # rolling sum of proximity_flag over prox_window

# Feature schema
feature_schema: configs/feature_schema.json
schema_version: v1.1

# Output paths
features_dir: logs/block_c/
features_suffix: _features.csv

# ── Scaler (Fix F13, Fix F18) — Day 11 ───────────────────────────────────────
scaler:
  type: minmax
  fit_split: train                       # ONLY train-split sequences (Fix F13)
  fit_label: normal
  path: models/minmax_scaler.pkl         # written Day 11
  clip_after_transform: true             # clip to [0,1] after transform (Fix F18)
  min_valid_fit_rows: 100                # fail fast if too few valid train rows after NaN exclusion
  scaled_suffix: _features_scaled.csv   # output file suffix for scaled CSVs
  metadata_path: logs/block_c/scaler_metadata.json

# Interpolated frame handling
exclude_interpolated_from_scaler_fit: true

# Seed
seed: 42