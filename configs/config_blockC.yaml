# config_blockC.yaml — Block C Feature Extraction Configuration
# Populated: Day 10 (F1 + F2). F3 added Day 11. Scaler added Day 11.

# —— Upstream frozen selections ————————————————————————————————————————————
detector: yolov8n                          # frozen from Block A (block_a_results.csv)
tracker: sort                              # frozen from Block B (block_b_results.json)

# —— Trajectory source (layout-aware — detect variant at runtime) ————————————
# Variant A path: {trajectory_base}{tracker}/trajectories_{seq}{trajectory_suffix}
# Variant B path: {trajectory_base}trajectories/{seq}_{tracker}{trajectory_suffix}
# Block C must re-detect DAY7_LAYOUT and construct paths accordingly.
trajectory_base: logs/block_b/
trajectory_suffix: _final.json
trajectory_stage: final                    # semantic alias — "final" = fragment-filtered + interpolated

# —— Warm-up stripping ————————————————————————————————————————————————————
warmup_frames_formula: "max(10, int(0.4 * fps))"   # computed at runtime from metadata.json fps
metadata_source: logs/metadata.json

# —— ROI Policy (Fix F17) —————————————————————————————————————————————————
roi_policy: full_frame
# Limitation: full-frame ROI includes roadside stationary vehicles.
# Pixel-based ROI requires camera calibration outside this project's scope.

# —— F1: Density/Flow Features ————————————————————————————————————————————
f1:
  vehicle_count: true
  roi_occupancy: true
  roi_occupancy_method: relative           # vehicle_count / max_vehicle_count (per clip)

# —— F2: Speed/Velocity Features (Fix F07) ————————————————————————————————
f2:
  vel_px_sec: true                         # velocity_norm * fps
  speed_window_sec: 0.2                    # rolling window in seconds — int(0.2*fps) frames at runtime
  smoothed_column: vel_px_sec_smooth       # output column name
  keep_raw: true                           # preserve vel_px_sec alongside smoothed version

# —— F3: Interaction Features — Day 11 ————————————————————————————————————
f3:
  inter_vehicle_dist_norm: false           # populated Day 11
  prox_window_sec: 2.0                     # populated Day 11
  dwell_time_sec: false                    # populated Day 11
  proximity_flag: false                    # populated Day 11

# —— Feature schema ————————————————————————————————————————————————————————
feature_schema: configs/feature_schema.json
schema_version: v1

# —— Output paths ——————————————————————————————————————————————————————————
features_dir: logs/block_c/
features_suffix: _features.csv

# —— Scaler (populated Day 11) ————————————————————————————————————————————
scaler:
  type: minmax
  fit_split: train                         # ONLY train-split sequences (Fix F13)
  fit_label: normal                        # train-split UA-DETRAC sequences treated as normal reference data
  path: models/minmax_scaler.pkl           # written Day 11 after fitting
  clip_after_transform: true              # clip to [0,1] after transform (Fix F18)

# —— Interpolated frame handling ——————————————————————————————————————————
exclude_interpolated_from_scaler_fit: true  # do not fit scaler on synthetic frames (conservative policy)

# —— Seed ——————————————————————————————————————————————————————————————————
seed: 42
